name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs: 
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python3 -m ruff check app tests

      - name: Run tests
        run: |
          mkdir reports
          python3 -m pytest -v --junitxml=reports/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/pytest.xml
          if-no-files-found: warn

  docker-build:
    name: Build Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t cicd-calc-api:${{ github.sha }} .

      - name: Start container
        run: docker run -d --name cicd-calc-api -p 8000:8000 cicd-calc-api:${{ github.sha }}

      - name: Verify health
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8000/health; then
              echo
              echo "Health check ok"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Health check failed"
          docker logs cicd-calc-api
          exit 1

      - name: Verify add endpoint
        run: |
          set -o pipefail
          curl --fail --silent "http://localhost:8000/add?a=2&b=3" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["result"] == 5.0'
          echo "Add endpoint OK"

      - name: Stop container
        if: always()
        run: docker rm -f cicd-calc-api || true
